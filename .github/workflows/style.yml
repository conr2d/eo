name: Style

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Show C++ formatting diff
        run: |
          find src examples tests -type f \
            \( -name '*.h' -o -name '*.hpp' -o -name '*.cpp' -o -name '*.cc' \) \
            -print0 | xargs -0 clang-format -i
          git diff -- src examples tests
          git diff --exit-code -- src examples tests

      - name: Check CMake formatting
        uses: cmakefmt/cmakefmt-action@v2
